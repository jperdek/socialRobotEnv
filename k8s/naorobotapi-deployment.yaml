apiVersion: apps/v1
kind: Deployment
metadata:
  name: naorobotapi-deployment
  labels:
    app: naorobotapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: naorobotapi
  template:
    metadata:
      labels:
        app: naorobotapi
    spec:
      containers:
      - name: naorobotapi
        image: jperdek/nao-robot-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: NAO_IP
          value: "localhost"  # Adjust as needed
        - name: NAO_PORT
          value: "9559"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: naorobotapi-service
spec:
  selector:
    app: naorobotapi
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30001
  type: LoadBalancer