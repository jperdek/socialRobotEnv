apiVersion: apps/v1
kind: Deployment
metadata:
  name: skeletonfinderapi-deployment
  labels:
    app: skeletonfinderapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skeletonfinderapi
  template:
    metadata:
      labels:
        app: skeletonfinderapi
    spec:
      containers:
      - name: skeletonfinderapi
        image: jperdek/skeleton-finder-api:latest
        ports:
        - containerPort: 6001
        env:
        - name: FLASK_ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /
            port: 6001
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: skeletonfinderapi-service
spec:
  selector:
    app: skeletonfinderapi
  ports:
  - port: 6001
    targetPort: 6001
    nodePort: 30002
  type: LoadBalancer