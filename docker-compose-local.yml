services:
    naoRobotAPI:
        build: 
            context: ./naoRobotAPI
            dockerfile: Dockerfile
        command: python server.py
        image: jperdek/nao-robot-api
        container_name: naoRobotAPI
        env_file: .env
        ports:
            - "127.0.0.1:5000:5000"
        environment:
            HOST_PORT: ${HOST_PORT:-1234}
            HOST_IP: ${HOST_IP:-127.0.0.1}
            NAO_PORT: ${NAO_PORT:-9559}
            NAO_IP: host.docker.internal
            FLASK_ENV: development
        depends_on:
            volumeCopyInit:
                condition: service_completed_successfully
        networks:
            - buildernet
        extra_hosts:
            - "host.docker.internal:host-gateway"
    volumeCopyInit:
        build:
            dockerfile: Dockerfile
        env_file: .env
        image: jperdek/copied-volumes-robotics
        volumes:
            - choregraphe-volume:/choregraphe
    choregraphe288:
        image: alvimpaulo/choregraphe:2.8.6
        user: "0:0"   
        environment:
            - DISPLAY=${DISPLAY}                 # e.g. :0
            - QT_X11_NO_MITSHM=1
            - XAUTHORITY=/root/.Xauthority      # so Qt reads the mounted cookie
            - QT_QPA_PLATFORM=xcb               # force xcb on Wayland
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw  # X socket
            - ${XAUTHORITY}:/root/.Xauthority:ro  # bind your live Xwayland cookie
            - ~/pynaoqi:/pynaoqi 
        ports:
            - "127.0.0.1:9559:9559"             # if you need NAOqi outside
        networks:
            - buildernet
    skeletonFinderAPI:
        build: 
            context: ./skeletonFinderAPI
            dockerfile: Dockerfile
        command: python server.py
        image: jperdek/skeleton-finder-api
        container_name: skeletonFinderAPI
        env_file: .env
        ports:
            - "127.0.0.1:6001:6001"
        environment:
            FLASK_ENV: development
        volumes:
            - /home/noetic/Pictures:/images:ro
        # depends_on:
        #     volumeCopyInit:
        #     condition: service_completed_successfully
        networks:
            - buildernet

volumes:
    choregraphe-volume:
networks:
    buildernet:
        driver: "bridge"
        